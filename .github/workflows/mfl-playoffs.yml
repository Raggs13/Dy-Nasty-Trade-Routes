name: Playoff race to Discord

on:
  schedule:
    - cron: "23 14 * * 2"   # Tuesdays 9:23 AM Eastern (10:23 AM before early November)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (show the message in the log, don't post)"
        type: boolean
        default: true
      force:
        description: "Post even if this week was already posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mfl-playoffs
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post playoff race
        env:
          DISCORD_PLAYOFF_WEBHOOK_URL: ${{ secrets.DISCORD_PLAYOFF_WEBHOOK_URL }}
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
          MFL_LEAGUE_ID: "24958"
          MFL_YEAR: "2026"
          MFL_HOST: "www44.myfantasyleague.com"
          # League settings: leave blank to read them from MFL
          PLAYOFF_TEAMS: ""          # e.g. "6"
          LAST_REGULAR_WEEK: "14"    # last week of the regular season
          SEASON_GAMES: "14"         # regular-season games per team
          DIVISION_WINNERS_IN: "false"   # "true" if division winners get automatic spots
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: python mfl_playoffs.py

      - name: Remember which week was posted
        run: |
          if [ -f playoff_state.json ] && [ -n "$(git status --porcelain playoff_state.json)" ]; then
            git config user.name "trade-bot"
            git config user.email "trade-bot@users.noreply.github.com"
            git add playoff_state.json
            git commit -m "Playoff race posted"
            git pull --rebase
            git push
          fi
