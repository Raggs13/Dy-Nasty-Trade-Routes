name: MFL trades to Discord

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: mfl-trades
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MFL and post new trades
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
          MFL_LEAGUE_ID: "24958"
          MFL_YEAR: "2026"
          MFL_HOST: "www44.myfantasyleague.com"
        run: python mfl_trades.py

      - name: Check the trade block
        if: always()
        continue-on-error: true   # a trade block problem never stops trade posts
        env:
          DISCORD_TRADEBLOCK_WEBHOOK_URL: ${{ secrets.DISCORD_TRADEBLOCK_WEBHOOK_URL }}
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
          MFL_LEAGUE_ID: "24958"
          MFL_YEAR: "2026"
          MFL_HOST: "www44.myfantasyleague.com"
        run: python mfl_tradeblock.py

      - name: Check adds, drops and waivers
        if: always()
        continue-on-error: true   # a problem here never stops trade posts
        env:
          DISCORD_WAIVERS_WEBHOOK_URL: ${{ secrets.DISCORD_WAIVERS_WEBHOOK_URL }}
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
          MFL_LEAGUE_ID: "24958"
          MFL_YEAR: "2026"
          MFL_HOST: "www44.myfantasyleague.com"
        run: |
          if [ -z "$DISCORD_WAIVERS_WEBHOOK_URL" ] || [ ! -f mfl_waivers.py ]; then
            echo "Waivers bot not set up yet; skipping."
          else
            python mfl_waivers.py
          fi

      - name: Save which trades, trade block changes and moves were posted
        if: always()
        run: |
          for f in state.json tradeblock_state.json waivers_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -n "$(git diff --cached --name-only)" ]; then
            git config user.name "trade-bot"
            git config user.email "trade-bot@users.noreply.github.com"
            git commit -m "Update posted trades / trade block"
            git pull --rebase
            git push
          fi
